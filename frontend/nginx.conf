# ==============================================================================
# Nginx Configuration for Jornal AI / MindLog AI
# Production configuration with HTTPS enforcement, ACME challenge,
# and secure authenticated private media streaming via X-Accel-Redirect.
# ==============================================================================

# 1. HTTP Server - Redirects all traffic to HTTPS (except ACME challenge)
server {
    listen 80;
    server_name mindlog-ai.swedencentral.cloudapp.azure.com 20.240.53.98 localhost _;

    # Let's Encrypt / Certbot ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic permanently to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Main Application Entrypoint
server {
    listen 443 ssl;
    http2 on;
    server_name mindlog-ai.swedencentral.cloudapp.azure.com 20.240.53.98 localhost _;

    # SSL / TLS Certificates
    # Bootstrap self-signed certificate is auto-generated on startup if Let's Encrypt is not yet active
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Maximum file upload size: 50M (matches backend MAX_FILE_SIZES for videos)
    client_max_body_size 50M;

    # Gzip compression for frontend assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Let's Encrypt / Certbot ACME HTTP-01 challenge (fallback for HTTPS requests)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 1. Frontend React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Django API Endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for CPU AI workloads (Whisper, Ollama)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3. Django Administration
    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Django Static files (Admin CSS, JS, fonts)
    location /static/ {
        alias /app/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 5. Private Media Access: Routes through Django for authentication and per-user authorization
    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Internal Protected Media Storage (X-Accel-Redirect)
    # Accessible ONLY via internal Django X-Accel-Redirect responses.
    # Direct access from the public internet returns 404 Not Found.
    location /protected_media/ {
        internal;
        alias /app/backend/media/;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }
}
